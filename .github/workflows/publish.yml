name: Publish

# One run per release command: every root release script ends with an
# atlassian release, so its tag is pushed last and this run publishes every
# package whose version is not on npm yet.
on:
  push:
    tags: ["atlassian-v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the previous tag of each package
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+, bundled since Node 24.5.0.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # check, test and build already ran in release-it's before:init; pnpm pack
      # runs each package's prepare (pnpm build) and turns workspace:* into real
      # versions; npm publish handles OIDC.
      - name: Publish new versions and create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for entry in jira:jira-v:jira-mcp confluence:conf-v:conf-mcp atlassian:atlassian-v:atlassian-mcp; do
            IFS=: read -r dir prefix title <<< "$entry"
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            tag="$prefix$version"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::$name@$version is not on npm and tag $tag does not exist"; exit 1
            fi
            # HEAD must carry the same package code as its release tag.
            if ! git diff --quiet "$tag" HEAD -- "packages/$dir"; then
              echo "::error::packages/$dir changed after $tag; release it again"; exit 1
            fi

            pnpm -C "packages/$dir" pack --pack-destination "$RUNNER_TEMP/$dir"
            npm publish "$RUNNER_TEMP/$dir"/*.tgz --access public

            if ! gh release view "$tag" > /dev/null 2>&1; then
              previous=$(git tag --list "$prefix*" --sort=-v:refname | sed -n "/^$tag\$/{n;p;q}")
              if [ -z "$previous" ]; then
                gh release create "$tag" --verify-tag --title "$title v$version" --generate-notes
                continue
              fi
              # No PRs in this repo, so --generate-notes would list nothing: use this package's commits.
              notes=$(git log --format='- %s (%h)' --invert-grep --grep='^chore(.*): release v' \
                "$previous..$tag" -- "packages/$dir")
              notes="${notes:-No code changes in packages/$dir.}"
              notes="$notes"$'\n\n'"Full Changelog: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$tag"
              gh release create "$tag" --verify-tag --title "$title v$version" --notes "$notes"
            fi
          done
